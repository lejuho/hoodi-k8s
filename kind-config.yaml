kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /data
    containerPath: /data
  extraPortMappings:
  - {containerPort: 30303, hostPort: 30303, protocol: TCP}
  - {containerPort: 30303, hostPort: 30303, protocol: UDP}
  - {containerPort: 9000,  hostPort: 9000,  protocol: TCP}
  - {containerPort: 9000,  hostPort: 9000,  protocol: UDP}
  - {containerPort: 9001,  hostPort: 9001,  protocol: UDP}
