apiVersion: apps/v1
kind: StatefulSet
metadata: {name: lighthouse, namespace: hoodi}
spec:
  serviceName: lighthouse
  replicas: 1
  selector: {matchLabels: {app: lighthouse}}
  template:
    metadata: {labels: {app: lighthouse}}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      containers:
      - name: lighthouse
        image: sigp/lighthouse:latest
        command: [lighthouse]
        args:
        - bn
        - --network=hoodi
        - --datadir=/data
        - --execution-endpoint=http://geth-engine:8551
        - --execution-jwt=/jwt/jwt.hex
        - --checkpoint-sync-url=https://checkpoint-sync.hoodi.ethpandaops.io
        - --http
        - --http-address=0.0.0.0
        - --metrics
        - --metrics-address=0.0.0.0
        ports:
        - {name: p2p-tcp, containerPort: 9000, hostPort: 9000, protocol: TCP}
        - {name: p2p-udp, containerPort: 9000, hostPort: 9000, protocol: UDP}
        - {name: quic, containerPort: 9001, hostPort: 9001, protocol: UDP}
        - {name: http, containerPort: 5052}
        - {name: metrics, containerPort: 5054}
        resources:
          requests: {cpu: 500m, memory: 4Gi}
          limits: {memory: 8Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: jwt, mountPath: /jwt, readOnly: true}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: lighthouse-data}
      - name: jwt
        secret: {secretName: jwt}
---
apiVersion: v1
kind: Service
metadata: {name: lighthouse, namespace: hoodi}
spec:
  selector: {app: lighthouse}
  ports:
  - {name: http, port: 5052}
